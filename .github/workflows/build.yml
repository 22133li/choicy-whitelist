name: Build Choicy-Whitelist (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install Theos
        run: |
          brew install ldid dpkg
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          # vendor/include 是子模块，必须显式拉取，否则缺 CydiaSubstrate/substrate.h 头文件
          cd /opt/theos && sudo git submodule update --init --recursive 2>&1 | tail -5
          cd -
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C /tmp
          sudo cp -r /tmp/sdks-master/*.sdk /opt/theos/sdks/ 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /opt/theos
          ls /opt/theos/sdks/ | head -5

      - name: Preflight checks
        run: |
          set -e
          echo "=== roothide devkit ==="
          ls roothide-devkit/roothide.h roothide-devkit/roothide/libroothide.tbd
          echo "=== external deps ==="
          ls external/litehook/src/litehook.h
          ls external/ChOma/src | head -3
          echo "=== patched code present ==="
          grep -q "CHWhitelistPolicy.h" Tweak.c && echo "policy header wired"
          grep -q "gChoicyActive" Tweak.c && echo "gChoicyActive present"
          grep -q "CHWhitelistAppExistsInApplications" ChoicySB/Tweak.x && echo "SB patch present"
          echo "=== substrate stub ==="
          ls -la libsubstrate-roothide.tbd

      - name: Fix CydiaSubstrate header layout
        run: |
          # theos/headers 把 CydiaSubstrate.h 放在根目录，但 substrate.h 期望 <CydiaSubstrate/CydiaSubstrate.h>
          INC=/opt/theos/vendor/include
          if [ -f "$INC/CydiaSubstrate.h" ] && [ ! -d "$INC/CydiaSubstrate" ]; then
            mkdir -p "$INC/CydiaSubstrate"
            ln -sf "$INC/CydiaSubstrate.h" "$INC/CydiaSubstrate/CydiaSubstrate.h"
          fi
          echo "=== verify ==="
          ls -la "$INC/CydiaSubstrate/" 2>&1 | head -5
          head -3 "$INC/substrate.h" 2>&1
          # 真实编译验证：能被预处理通过才算数
          echo '#import <substrate.h>' > /tmp/subcheck.m
          clang -fsyntax-only -x objective-c -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
                -I"$INC" -arch arm64e -miphoneos-version-min=15.0 /tmp/subcheck.m \
            && echo "substrate.h OK"

      - name: Install roothide substrate stub
        run: |
          mkdir -p /opt/theos/vendor/lib/iphone/roothide
          cp libsubstrate-roothide.tbd /opt/theos/vendor/lib/iphone/roothide/libsubstrate.tbd
          # 设了 THEOS_PACKAGE_SCHEME 后搜索路径只剩 vendor/lib/<target>/<scheme>，
          # 而 Theos 对所有 iphone 目标无条件注入 -lroot，需把 libroot 暴露到 scheme 目录
          ln -sf /opt/theos/vendor/lib/libroot.a /opt/theos/vendor/lib/iphone/roothide/libroot.a
          ln -sf /opt/theos/vendor/lib/libroot_oldabi.a /opt/theos/vendor/lib/iphone/roothide/libroot_oldabi.a
          ls -la /opt/theos/vendor/lib/iphone/roothide/

      - name: Install roothide package scheme
        run: |
          # 标准 Theos 没有 roothide scheme，补一个 vendor/mod 模块
          mkdir -p /opt/theos/vendor/mod/roothide/package
          cp theos-vendor/roothide/package.mk /opt/theos/vendor/mod/roothide/package.mk
          cp theos-vendor/roothide/package/deb.mk /opt/theos/vendor/mod/roothide/package/deb.mk
          echo "=== installed scheme files ==="
          find /opt/theos/vendor/mod/roothide -type f
          echo "=== content ==="
          cat /opt/theos/vendor/mod/roothide/package.mk
          cat /opt/theos/vendor/mod/roothide/package/deb.mk

      - name: Generate musttail assembly
        run: |
          # Tweak.s 依赖 gen.<arch>.s，需用支持 __attribute__((musttail)) 的 clang 现场生成
          chmod +x gen_asm.sh
          ./gen_asm.sh
          echo "=== generated ==="
          ls -la gen.*.s

      - name: Build and install AltList
        run: |
          # Choicy 的 ChoicyPrefs 依赖 AltList 头文件与符号。
          # AltList 自身需要 Preferences 私有框架才能链接，因此只提供 headers + tbd 桩。
          mkdir -p /opt/theos/vendor/lib/iphone/roothide/AltList.framework/Headers
          cp external/AltList/*.h /opt/theos/vendor/lib/iphone/roothide/AltList.framework/Headers/
          rm -f /opt/theos/vendor/lib/iphone/roothide/AltList.framework/Headers/AltList.h
          echo "=== headers installed ==="
          ls /opt/theos/vendor/lib/iphone/roothide/AltList.framework/Headers | head -5
          echo "=== generate tbd ==="
          python3 scripts/gen_altlist_tbd.py
          echo "=== tbd content ==="
          cat /opt/theos/vendor/lib/iphone/roothide/AltList.framework/AltList.tbd

      - name: Install private framework stubs
        run: |
          # Preferences 是私有框架：SDK/vendor 只有头文件，没有链接桩
          mkdir -p /opt/theos/vendor/include/Preferences
          echo "=== vendor headers present? ==="
          ls /opt/theos/vendor/include/Preferences | head -5 || true
          python3 scripts/gen_private_tbd.py
          echo "=== stub content ==="
          cat /opt/theos/vendor/lib/iphone/roothide/Preferences.framework/Preferences.tbd

      - name: Build
        id: build
        continue-on-error: true
        run: |
          export THEOS=/opt/theos
          make clean >/dev/null 2>&1 || true
          set +e
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide \
               ARCHS=arm64e TARGET=iphone:clang:latest:15.0 DEBUG=0 \
               > build.log 2>&1
          RC=$?
          set -e
          echo "make exit: $RC"
          tail -40 build.log
          exit $RC

      - name: Diagnose errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========== ERRORS ==========="
          grep -nE "error:|fatal error:" build.log | head -50 || echo "(no explicit error lines)"
          echo "=========== FIRST ERROR CONTEXT ==========="
          grep -nE -A5 -B5 "error:" build.log | head -60 || true
          echo "=========== TAIL ==========="
          tail -60 build.log

      - name: Collect artifact
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p output
          find . -name "*.deb" -path "*packages*" -exec cp {} output/ \;
          ls -la output/
          for f in output/*.deb; do
            echo "----- $f -----"
            dpkg-deb -I "$f"
            echo "----- files -----"
            dpkg-deb -c "$f" | head -30
            md5sum "$f"; shasum -a 256 "$f"
          done

      - name: Upload .deb
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: choicy-whitelist-deb
          path: output/*.deb
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
